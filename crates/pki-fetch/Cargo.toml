[package]
name = "sigis-pki-fetch"
description = "HTTP fetchers for OCSP, CRLs, certificates and RFC 3161 timestamps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
sigis-pki-core = { workspace = true }
der = { workspace = true }
spki = { workspace = true }
const-oid = { workspace = true }
x509-cert = { workspace = true, features = ["hazmat"] }
x509-ocsp = { workspace = true }
x509-tsp = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
getrandom = "0.3"

[dev-dependencies]
sigis-testdata = { workspace = true }
sigis-pki-certvalidator = { workspace = true }
sigis-cms = { workspace = true }
serde_json = { workspace = true }
