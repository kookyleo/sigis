path = "fuzz_targets/parse_object.rs"
test = false
doc = false
bench = false

[[bin]]
name = "xref_stream"
path = "fuzz_targets/xref_stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "object_stream"
path = "fuzz_targets/object_stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "incremental_roundtrip"
path = "fuzz_targets/incremental_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "xmp"
path = "fuzz_targets/xmp.rs"
test = false
