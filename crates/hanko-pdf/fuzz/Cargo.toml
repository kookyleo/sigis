[package]
name = "hanko-pdf-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "Apache-2.0 AND MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
hanko-pdf = { path = ".." }

# Not part of the main workspace: built with `cargo fuzz` (nightly).
[workspace]

