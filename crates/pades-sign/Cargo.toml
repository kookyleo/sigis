[package]
name = "hanko-sign"
description = "PDF and CMS signing, PAdES B-B to B-LTA (port of pyHanko signers)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
hanko-core = { workspace = true }
hanko-certvalidator = { workspace = true }
hanko-pdf = { workspace = true }
spki = { workspace = true }
der = { workspace = true }
const-oid = { workspace = true }
x509-cert = { workspace = true }
cms = { workspace = true }
x509-tsp = { workspace = true }
x509-ocsp = { workspace = true }
rsa = { workspace = true, features = ["getrandom"] }
ecdsa = { workspace = true, features = ["algorithm"] }
p256 = { workspace = true }
p384 = { workspace = true }
p521 = { workspace = true }
ed25519-dalek = { workspace = true }
signature = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
base64ct = { workspace = true }
lopdf = { workspace = true }
# Key containers: PKCS#8 (incl. PBES2), legacy OpenSSL PEM, PKCS#12.
pkcs8 = { version = "0.11", features = ["alloc", "encryption", "3des", "des-insecure", "sha1-insecure"] }
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
des = "0.8"
rc2 = "0.8"
cbc-legacy = { package = "cbc", version = "0.1", features = ["alloc"] }
md-5 = "0.11"
hmac = "0.13"
getrandom = "0.3"
flate2 = "1"
# ML-DSA (FIPS 204) signing
ml-dsa = "0.1"
# Key providers: PKCS#11 tokens and CSC remote signing services.
cryptoki = "0.12.1"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# appearances: stamps, text layout, fonts, images, QR codes, barcodes
ttf-parser = "0.25.1"
rustybuzz = "0.20.1"
subsetter = { version = "0.2.6", default-features = false }
qrcode = { version = "0.14.1", default-features = false }
png = "0.18.1"
zune-jpeg = "0.4.21"
serde_json = { workspace = true }

[dev-dependencies]
hanko-testdata = { workspace = true }
tiny_http = "0.12.0"
