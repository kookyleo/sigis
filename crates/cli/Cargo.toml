[package]
name = "sigis-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Rust command-line interface compatible with pyHanko"

[[bin]]
name = "pyhanko"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_yaml = "=0.9.34"
yaml-rust2 = { version = "=0.13.0", default-features = false }
regex = { workspace = true }
serde_json = { workspace = true }
sigis-pades-sign = { workspace = true }
sigis-pki-core = { workspace = true }
sigis-pdf = { workspace = true }
sigis-pki-fetch = { workspace = true }
rpassword = "=7.5.0"
openssl = "=0.10.81"

der = { workspace = true }
sigis-cms = { workspace = true }
sigis-pades = { workspace = true }
sigis-pdf-diff = { workspace = true }
sigis-pki-certvalidator = { workspace = true }
sigis-eutl = { workspace = true }

[dev-dependencies]
sigis-cms = { workspace = true }
lopdf = { workspace = true }
sigis-testdata = { workspace = true }
tempfile = "=3.27.0"
