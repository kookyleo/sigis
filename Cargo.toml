[package]
name = "sigis"
version = "0.0.1"
edition = "2021"
description = "Signature Integrity Service: open-source PDF signing and verification"
license = "Apache-2.0"
repository = "https://github.com/kookyleo/sigis"
readme = "README.md"
keywords = ["pdf", "signature", "pades", "verification"]
categories = ["cryptography"]
exclude = ["vendor/"]

[workspace]
members = [
    ".",
    # L0 PKI
    "crates/pki-core",
    "crates/pki-certvalidator",
    "crates/pki-fetch",
    # L1 formats
    "crates/cms",
    "crates/pdf",
    "crates/pdf-diff",
    "crates/xmldsig",
    # L2 AdES
    "crates/ades-model",
    "crates/eutl",
    "crates/pades",
    "crates/pades-sign",
    "crates/cades",
    "crates/xades",
    "crates/asic",
    # L3 containers
    "crates/ooxml",
    "crates/odf",
    # L4 facades
    "crates/hanko",
    "crates/xsig",
    # L5 service API
    "crates/sign",
    # test support (dev-dependency only)
    "crates/testdata",
]
# The vendored crate is a patched dependency, not a workspace member: its own
# tests need fixtures that are not shipped.
exclude = ["vendor/underskrift", "vendor/const-oid"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.89"
# Original Sigis code is Apache-2.0; files derived from pyHanko keep its MIT license.
license = "Apache-2.0 AND MIT"
repository = "https://github.com/kookyleo/sigis"
publish = false

# Shared dependency versions for the sigis-hanko crates (owned by the lead,
# see docs/hanko-lanes.md). The RustCrypto rc versions are pinned exactly to
# the versions certval =0.2.0-rc.2 uses, so that types are shared.
[workspace.dependencies]
# Workspace crates (layers: docs/crates.md).
sigis-pki-core = { path = "crates/pki-core" }
sigis-pki-certvalidator = { path = "crates/pki-certvalidator" }
sigis-pki-fetch = { path = "crates/pki-fetch" }
sigis-cms = { path = "crates/cms" }
sigis-pdf = { path = "crates/pdf" }
sigis-pdf-diff = { path = "crates/pdf-diff" }
sigis-xmldsig = { path = "crates/xmldsig" }
sigis-ades-model = { path = "crates/ades-model" }
sigis-eutl = { path = "crates/eutl" }
sigis-pades = { path = "crates/pades" }
sigis-pades-sign = { path = "crates/pades-sign" }
sigis-cades = { path = "crates/cades" }
sigis-xades = { path = "crates/xades" }
sigis-asic = { path = "crates/asic" }
sigis-ooxml = { path = "crates/ooxml" }
sigis-odf = { path = "crates/odf" }
sigis-hanko = { path = "crates/hanko" }
sigis-xsig = { path = "crates/xsig" }
sigis-testdata = { path = "crates/testdata" }

der = { version = "0.8.3", features = ["alloc", "derive", "oid", "pem"] }
spki = { version = "0.8.1", features = ["alloc"] }
const-oid = { version = "0.10.2", features = ["db"] }
x509-cert = { version = "0.3.0", default-features = false, features = ["pem"] }
cms = { version = "=0.3.0-rc.1", default-features = false }
x509-ocsp = { version = "=0.3.0-rc.0", default-features = false }
x509-tsp = { version = "=0.2.0-rc.0", default-features = false }
certval = { version = "=0.2.0-rc.2", default-features = false, features = ["std", "revocation", "rsa", "eddsa", "sha1_sig"] }
rsa = { version = "=0.10.0-rc.21", default-features = false, features = ["encoding"] }
ecdsa = { version = "0.17.0", default-features = false, features = ["der", "digest"] }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }
p384 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }
p521 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }
ed25519-dalek = { version = "3.0.0", default-features = false }
signature = { version = "3.0.0", default-features = false }
sha2 = { version = "0.11.0", default-features = false, features = ["oid"] }
sha1 = { version = "0.11.0", default-features = false, features = ["oid"] }
base64ct = { version = "1.8", features = ["alloc"] }
thiserror = "2"
lopdf = { version = "0.47", default-features = false }
quick-xml = "0.38.4"
base64 = "0.22"
regex = "1"
serde_json = "1"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
serde_json = "1"
openssl = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
underskrift = { version = "0.1.4", default-features = false, features = ["verify", "tsp"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

# Vendored underskrift 0.1.4 with a minimal patch that embeds an RFC 3161
# signature timestamp (PAdES B-T). See vendor/README.md.
[patch.crates-io]
underskrift = { path = "vendor/underskrift" }
# const-oid 0.10.3 with second arcs above 39 under first arc 2 (X.690
# 8.19.4), e.g. pyHanko's test policy OID 2.999.31337.0. Upstream issue and
# patch: vendor/const-oid.UPSTREAM.md. Remove once upstream releases a fix.
const-oid = { path = "vendor/const-oid" }
