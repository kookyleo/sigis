[package]
name = "sigis"
version = "0.0.1"
edition = "2021"
description = "Signature Integrity Service: open-source PDF signing and verification"
license = "Apache-2.0"
repository = "https://github.com/kookyleo/sigis"
readme = "README.md"
keywords = ["pdf", "signature", "pades", "verification"]
categories = ["cryptography"]

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
serde_json = "1"
openssl = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
underskrift = { version = "0.1.4", default-features = false, features = ["verify", "tsp"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
